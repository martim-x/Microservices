name: Microservices CI

on:
    push:
        branches: [main]
        paths:
            - "testing_and_deployment/task8/**"
            - ".github/workflows/ci.yml"
    pull_request:
        paths:
            - "testing_and_deployment/task8/**"
            - ".github/workflows/ci.yml"

jobs:
    lint-type-security:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                service:
                    - auth-service
                    - order-service
                    - report-service
                    - user-product-service

        defaults:
            run:
                working-directory: testing_and_deployment/task8/${{ matrix.service }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Upgrade pip
              run: python -m pip install --upgrade pip

            - name: Install service dependencies
              run: |
                  if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
                  pip install ruff mypy bandit

            - name: Run Ruff
              run: ruff check .

            - name: Run Mypy
              run: mypy .

            - name: Run Bandit
              run: bandit -r . -x .venv,venv,__pycache__,tests
