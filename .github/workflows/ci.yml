name: Microservices CI

on:
    push:
        branches: [prod, dev]

    pull_request:
        branches: [prod, dev]

jobs:
    lint-type-security:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                service:
                    - auth-service
                    - order-service
                    - report-service
                    - user-product-service

        defaults:
            run:
                working-directory: ${{ matrix.service }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.14"

            - name: Upgrade pip
              run: python -m pip install --upgrade pip

            - name: Install service dependencies
              run: |
                  if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
                  pip install ruff mypy bandit

            - name: Run Ruff
              run: ruff check .

            - name: Run Mypy
              run: mypy .

            - name: Run Tests
              run: python -m pytest --cov=. --cov-report=html -v
